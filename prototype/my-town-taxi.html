<title>MY TOWN TAXI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@500&display=swap" rel="stylesheet">
<style>
:root{--pri:#17191B;--pri2:#3A4044;--prisoft:#FFF1BF;--acc:#FFC21A;--bg:#F3F5F4;--card:#fff;--ink:#14201C;--mut:#64746E;--line:#E2E8E5;--red:#C8372D;--redsoft:#FBE9E7;--ok:#1F8A4C;--oksoft:#E4F4EA;--warn:#A86A12;--warnsoft:#FDF1DC;--blue:#2D5BD8;--bluesoft:#E6EDFC}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#D9E0DD}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:84px}
@media(min-width:520px){#phone{margin:24px auto;min-height:calc(100vh - 48px);border-radius:30px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.18)}}
.bar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:8px;padding:14px 14px;min-height:58px}
.bar h1{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ib{background:rgba(255,255,255,.12);border:0;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:#fff}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--acc);color:#3a2600;padding:5px 9px;border-radius:99px}
.content{padding:14px}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:25}
.foot .grow{flex:1;min-width:0}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;position:relative}
#nav button.on{color:var(--pri)}
#nav button.on svg{background:var(--prisoft);border-radius:99px}
#nav svg{width:44px;height:26px;padding:3px 10px}
.cnt{position:absolute;top:4px;right:calc(50% - 26px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line);margin-bottom:12px}
.card.flat{border:0}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700;margin-bottom:8px}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 2px 8px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11.5px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}
.mt{margin-top:8px}.mt2{margin-top:14px}.mb{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*,.grid3>*{min-width:0}
.mstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.mstrip::-webkit-scrollbar{display:none}
.mtile{flex:none;width:136px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px 8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;scroll-snap-align:start}
.mtile.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--acc)}
.mtile .mimg{background:linear-gradient(140deg,#F4F6F5,#E3E9E6);border-radius:11px;aspect-ratio:2/1.15;display:grid;place-items:center;margin-bottom:5px;overflow:hidden}
.mtile .mimg .carsvg{width:96%}
.mtile b{font-size:13px}.mtile span{font-size:11.5px;color:var(--mut)}
.grid2 .mtile{width:auto}
input[type=datetime-local].inp{font-size:13px;padding:11px 8px;min-width:0;width:100%}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--pri);color:#fff;font-weight:700;padding:14px 16px;border-radius:14px;cursor:pointer;font-size:15px;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn.acc{background:var(--acc);color:#2b1c00}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px;margin-top:0;width:auto}
.btn[disabled]{background:#B9C4C0;cursor:not-allowed}
.foot .btn{margin:0;width:auto;padding:14px 22px}
.link{background:none;border:0;color:var(--pri);font-weight:700;padding:10px 0;cursor:pointer;display:block;margin:6px auto 0;font-size:14px}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 0 5px}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:15px;outline:none}
.inp:focus{border-color:var(--pri2)}
textarea.inp{min-height:76px;resize:vertical}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--oksoft);color:var(--ok)}.b-warn{background:var(--warnsoft);color:var(--warn)}.b-red{background:var(--redsoft);color:var(--red)}.b-blue{background:var(--bluesoft);color:var(--blue)}.b-mut{background:#ECEFEE;color:var(--mut)}
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warnsoft);color:#6b4308}.banner.ok{background:var(--oksoft);color:#14532d}.banner.red{background:var(--redsoft);color:#7f1d1d}.banner.info{background:var(--bluesoft);color:#1e3a8a}
.ccard{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;cursor:pointer}
.cimg{position:relative;background:linear-gradient(140deg,#EEF4F1,#DCE7E2);aspect-ratio:2/1;display:grid;place-items:center;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover}
.carsvg{width:82%;height:auto}
.cimg .tag{position:absolute;left:10px;top:10px}
.cbody{padding:12px 14px 14px}
.price{font-size:18px;font-weight:800}
.rate{font-size:13px;font-weight:700;color:#7a5200;background:#FFF4DC;padding:3px 8px;border-radius:99px}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:-14px -14px 12px;padding:0}
.gallery>div{flex:none;width:100%;scroll-snap-align:start}
.spec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.spec b{display:block;font-size:14px}.spec span{font-size:11.5px;color:var(--mut)}
.li{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.li.tot{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:800;font-size:16px}
.av{width:44px;height:44px;border-radius:14px;background:var(--prisoft);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.av.lg{width:64px;height:64px;font-size:22px;border-radius:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-size:20px;font-weight:800;margin-top:2px}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.hero-stat{background:linear-gradient(135deg,var(--pri),#050607);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px}
.hero-stat .big{font-size:30px;font-weight:800;margin:4px 0}
.seg{display:flex;background:#E6EBE9;border-radius:13px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mut);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.trow{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer}
.thumb{width:84px;height:56px;border-radius:12px;background:linear-gradient(140deg,#EEF4F1,#DCE7E2);display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb .carsvg{width:92%}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pslot{aspect-ratio:4/3;border:2px dashed #C7D2CE;border-radius:14px;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:#F8FAF9;font-weight:700;color:var(--mut);font-size:13px;position:relative}
.pslot img{width:100%;height:100%;object-fit:cover}
.pslot .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:99px;width:24px;height:24px;cursor:pointer}
.ph{border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#eee;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;padding:2px 6px;border-radius:6px}
.doc{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.stars{display:flex;gap:6px;font-size:30px;margin:6px 0}
.stars button{background:none;border:0;cursor:pointer;color:#D3D9D7;font-size:30px;line-height:1}
.stars button.on{color:var(--acc)}
.sw{position:relative;width:46px;height:27px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#C8D1CD;border-radius:99px;cursor:pointer;transition:.2s}
.sw i:before{content:'';position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{transform:translateX(19px)}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2.5px var(--pri)}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .ic{font-size:40px;margin-bottom:8px}
.tl{position:relative;padding-left:22px}
.tl div{position:relative;padding:0 0 12px;font-size:13.5px}
.tl div:before{content:'';position:absolute;left:-17px;top:4px;width:10px;height:10px;border-radius:50%;background:#C8D1CD}
.tl div.done:before{background:var(--ok)}
.tl div:after{content:'';position:absolute;left:-13px;top:16px;bottom:-2px;width:2px;background:#E1E7E4}
.tl div:last-child:after{display:none}
#modal{position:fixed;inset:0;background:rgba(10,20,16,.5);display:none;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:#fff;width:100%;max-width:430px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;background:#D9DFDC;border-radius:9px;margin:-6px auto 12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:#14201C;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:60;max-width:90%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.pay-opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.pay-opt.on{border-color:var(--pri);background:var(--prisoft)}
.pay-opt .r{width:18px;height:18px;border-radius:50%;border:2px solid #AAB5B1;flex:none}
.pay-opt.on .r{border:6px solid var(--pri)}
.spin{width:44px;height:44px;border:4px solid var(--prisoft);border-top-color:var(--pri);border-radius:50%;animation:sp 0.8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.check{width:84px;height:84px;border-radius:50%;background:var(--oksoft);display:grid;place-items:center;margin:20px auto 12px}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--pri) 0 46%,var(--bg) 46%)}
.hero{color:#fff;text-align:center;padding:44px 20px 26px}
.hero h1{font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.hero p{opacity:.85;margin-top:4px}
.te{font-family:'Noto Sans Telugu',sans-serif;font-size:16px;color:var(--acc);opacity:1!important}
.logo{width:72px;height:72px;border-radius:22px;background:var(--acc);display:grid;place-items:center;margin:0 auto}
.lcard{background:#fff;margin:0 16px;border-radius:24px;padding:22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.phoneinp{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.phoneinp span{padding:12px;background:#F3F5F4;font-weight:700}
.phoneinp input{border:0;outline:0;padding:12px;flex:1;font-size:16px;letter-spacing:.04em;min-width:0}
.otp{text-align:center;font-size:24px;letter-spacing:.6em;margin-top:14px}
.rolecard{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;cursor:pointer;background:#fff;width:100%;text-align:left}
.rolecard:hover{border-color:var(--pri2)}
.rolecard .ri{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:24px;flex:none}
.tiny{text-align:center;font-size:12px;color:var(--mut);padding:18px}
.hr{height:1px;background:var(--line);margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--mut)}
</style>
<div id="phone"><div id="app"></div><div id="nav"></div></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
const HR=36e5,DAY=864e5;

function at9(d){const x=new Date();x.setDate(x.getDate()+d);x.setHours(9,0,0,0);return x.getTime()}
function fdt(ms){const d=new Date(ms);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}
function fd(ms){return new Date(ms).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function toLocal(ms){const d=new Date(ms),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const maskPh=p=>p?'+91 '+p.slice(0,5)+' •••'+p.slice(-2):'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}

 ['Tata','Nexon EV','csuv','SUV','Electric','Automatic',5,2499,5000,'#3A9D5D','ev'],

function isFree(cid,from,to,ignore){return !S.bookings.some(b=>b.carId===cid&&b.id!==ignore&&(b.status==='confirmed'||b.status==='active')&&b.from<to&&from<b.to)}
const payout=b=>Math.round(b.rent*(1-b.comm/100))+(b.dep==='partial'?b.damage:0)+(['refunded','partial'].includes(b.dep)?b.extraKmCharge:0);
const platformRev=b=>b.status==='cancelled'?0:Math.round(b.rent*b.comm/100)+b.fee;
function depLabel(b){return{held:['Held — refunded after the trip','b-blue'],inspection:['Host inspecting car (max 48 h)','b-warn'],disputed:['Damage claim under review','b-red'],refunded:['Refunded '+fmt(b.refund),'b-ok'],partial:['Refunded '+fmt(b.refund)+' after deduction','b-warn'],refunded_cancel:['Cancelled · '+fmt(b.refund)+' refunded','b-mut']}[b.dep]||['—','b-mut']}
function stLabel(b){return{confirmed:['Upcoming','b-blue'],active:['On trip','b-ok'],completed:['Completed','b-mut'],cancelled:['Cancelled','b-red']}[b.status]}

SCR.trip=({id})=>{

 ${act}

 <div class="card"><div class="row sb"><b>Security deposit</b>${badge(depLabel(b))}</div>${b.extraKmCharge?`<p class="sm mt">Extra ${b.extraKm} km × ${fmt(S.settings.extraKm)} = <b>${fmt(b.extraKmCharge)}</b> deducted from deposit</p>`:''}${b.dep==='disputed'?`<p class="sm mt">Host reported damage of <b>${fmt(b.damage)}</b>: “${esc(b.damageNote)}”. Our team is comparing pickup and return photos.</p>`:''}</div>
 <div class="card row"><div class="av">${initials(o.name)}</div><div style="flex:1"><b>${esc(o.name)}</b><div class="sm mut">Host · ${maskPh(o.phone)}</div></div><span class="xs mut">Call masked<br>in live app</span></div>
 ${photosBlock(b)}
 <div class="card"><h3>Payment</h3><div class="li"><span>Rent (${b.days} day${b.days>1?'s':''})</span><span>${fmt(b.rent)}</span></div><div class="li"><span>Fee + GST</span><span>${fmt(b.fee+b.gst)}</span></div><div class="li"><span>Deposit</span><span>${fmt(b.deposit)}</span></div><div class="li tot"><span>Paid via ${esc(b.pay)}</span><span>${fmt(b.total)}</span></div>${b.status==='cancelled'?`<p class="sm mt" style="color:var(--ok)">Refunded ${fmt(b.refund)} to original payment method</p>`:''}</div>
 ${b.review?`<div class="card"><b>Your review</b><div style="color:var(--acc)">${'★'.repeat(b.review.s)}</div><p class="sm">${esc(b.review.t)}</p></div>`:''}`}};
function photosBlock(b){if(!b.before.length&&!b.after.length)return'';const sides=['Front','Back','Left','Right'];
 return `<div class="card"><h3>Condition photos</h3><p class="xs mut mb">Pickup vs return — used to settle any damage claim.</p>${sides.map((s,i)=>`<div class="grid2 mb"><div class="ph">${b.before[i]?`<img src="${b.before[i]}"><span>${s} · pickup</span>`:'<span>—</span>'}</div><div class="ph">${b.after[i]?`<img src="${b.after[i]}"><span>${s} · return</span>`:`<span>${s} · return pending</span>`}</div></div>`).join('')}</div>`}
function photoModal(bid,kind){T.ph={bid,kind,imgs:{},odo:'',fuel:'Full'};drawPhoto()}
function drawPhoto(){const P=T.ph,b=bkById(P.bid);const sides=['Front','Back','Left','Right'];
 modal(`<h3>${P.kind==='before'?'Start trip':'End trip'} — car photos</h3><p class="sm mut">Take clear photos of all 4 sides${P.kind==='after'?' in the same angles as pickup':''}. They protect both you and the host.</p>
 <div class="pgrid">${sides.map(s=>`<label class="pslot">${P.imgs[s]?`<img src="${P.imgs[s]}">`:`<span>📷 ${s}</span>`}<input type="file" accept="image/*" capture="environment" hidden onchange="phPick('${s}',this)"></label>`).join('')}</div>
 <button class="link" style="margin-top:0" onclick="phSample()">Use sample photos (demo)</button>
 <div class="grid2"><div><label class="lbl">Odometer (km)</label><input class="inp" id="odo" inputmode="numeric" value="${esc(P.odo)}" placeholder="${P.kind==='after'&&b.startOdo?'more than '+b.startOdo:'e.g. 24510'}" oninput="T.ph.odo=this.value"></div><div><label class="lbl">Fuel / charge</label><select class="inp" onchange="T.ph.fuel=this.value">${['Full','3/4','1/2','1/4','Reserve'].map(f=>`<option ${P.fuel===f?'selected':''}>${f}</option>`).join('')}</select></div></div>
 <button class="btn acc" onclick="phSubmit()">${P.kind==='before'?'Start trip':'End trip & return car'}</button><button class="btn ghost" onclick="closeModal()">Not now</button>`)}
async function phPick(s,inp){const d=await readImg(inp.files[0]);if(!d)return toast('Could not read that image');T.ph.imgs[s]=d;drawPhoto()}
function phSample(){const tag=T.ph.kind==='before'?'pickup':'return';['Front','Back','Left','Right'].forEach((s,i)=>T.ph.imgs[s]=samplePhoto(s+' · '+tag,['#4F625C','#5C5470','#6B5B3E','#3E5C6B'][i]));if(!T.ph.odo){const b=bkById(T.ph.bid);T.ph.odo=String(T.ph.kind==='before'?24000+Math.floor(Math.random()*9000):(b.startOdo||0)+Math.round(180+Math.random()*420))}drawPhoto()}
function phSubmit(){const P=T.ph,b=bkById(P.bid),c=carById(b.carId);const imgs=['Front','Back','Left','Right'].map(s=>P.imgs[s]);
 if(imgs.some(x=>!x))return toast('Add a photo for all 4 sides');const odo=parseInt(P.odo,10);if(!(odo>0))return toast('Enter the odometer reading');
 if(P.kind==='before'){Object.assign(b,{before:imgs,startOdo:odo,fuelStart:P.fuel,status:'active'});toast('Trip started — drive safe! 🚗')}
 else{if(odo<=b.startOdo)return toast('Return odometer must be more than '+b.startOdo);const km=odo-b.startOdo,ex=Math.max(0,km-c.kmLimit*b.days);Object.assign(b,{after:imgs,endOdo:odo,fuelEnd:P.fuel,status:'completed',dep:'inspection',extraKm:ex,extraKmCharge:Math.min(b.deposit,ex*S.settings.extraKm),returnedAt:Date.now()});toast('Trip ended. Host will inspect the car.')}
 save();closeModal();render()}
function cancelModal(id){const b=bkById(id),free=b.from-Date.now()>24*HR,ref=free?b.total:b.total-Math.round(b.rent*.5);

function doCancel(id,ref){const b=bkById(id);Object.assign(b,{status:'cancelled',dep:'refunded_cancel',refund:ref,cancelledBy:S.session.mode});save();closeModal();toast('Booking cancelled. '+fmt(ref)+' will be refunded.');render()}

SCR.kyc=()=>{const u=me(),k=u.kyc;

 if(k.status==='pending')return{title:'KYC verification',body:`<div class="banner warn"><span>⏳</span><span><b>Under review.</b> Submitted ${fdt(k.submitted)}. Usually approved within 2 hours.<br><span class="xs">Demo: open Profile → Switch account → Admin to approve it.</span></span></div><div class="card kv"><span>Licence no.</span><b>${esc(k.dl)}</b><span>Date of birth</span><b>${esc(k.dob)}</b><span>Aadhaar</span><b>XXXX XXXX ${esc(k.aad)}</b></div><div class="grid2"><img class="doc" src="${k.dlImg}"><img class="doc" src="${k.aadImg}"></div>`};
 const D=T.kyc||(T.kyc={dl:'',dob:'',aad:'',dlImg:'',aadImg:''});
 return{title:'KYC verification',body:`${k.status==='rejected'?`<div class="banner red"><span>⚠️</span><span><b>Rejected:</b> ${esc(k.reason||'Documents unclear')}. Please upload again.</span></div>`:`<div class="banner info"><span>🛡️</span><span>We verify every driver to keep owners' cars safe. You need to be 21+ with a valid Indian driving licence.</span></div>`}
 <div class="card"><label class="lbl" style="margin-top:0">Driving licence number</label><input class="inp" placeholder="TS09 20190012345" value="${esc(D.dl)}" oninput="T.kyc.dl=this.value.toUpperCase()" style="text-transform:uppercase">
 <label class="lbl">Date of birth</label><input class="inp" type="date" value="${esc(D.dob)}" onchange="T.kyc.dob=this.value">
 <label class="lbl">Aadhaar number</label><input class="inp" inputmode="numeric" maxlength="14" placeholder="1234 5678 9012" value="${esc(D.aad)}" oninput="T.kyc.aad=this.value"><p class="xs mut" style="margin-top:4px">Only the last 4 digits are stored.</p>
 <div class="grid2 mt2"><div><label class="lbl" style="margin-top:0">Licence photo</label><label class="pslot">${D.dlImg?`<img src="${D.dlImg}">`:'<span>📷 Upload</span>'}<input type="file" accept="image/*" hidden onchange="kycPick('dlImg',this)"></label></div><div><label class="lbl" style="margin-top:0">Aadhaar photo</label><label class="pslot">${D.aadImg?`<img src="${D.aadImg}">`:'<span>📷 Upload</span>'}<input type="file" accept="image/*" hidden onchange="kycPick('aadImg',this)"></label></div></div>
 <button class="link" onclick="kycSample()">Fill sample details (demo)</button></div>
 <button class="btn" onclick="kycSubmit()">Submit for verification</button>`}};
async function kycPick(k,inp){const d=await readImg(inp.files[0]);if(!d)return toast('Could not read that image');T.kyc[k]=d;render()}
function kycSample(){Object.assign(T.kyc,{dl:'TS09 20180045678',dob:'1996-08-15',aad:'5678 1234 9012',dlImg:samplePhoto('Driving Licence','#3C5A8A'),aadImg:samplePhoto('Aadhaar Card','#7A5A2A')});render()}
function kycSubmit(){const D=T.kyc,u=me();
 if(!/^[A-Z]{2}[\s-]?\d{2}[\s-]?\d{6,11}$/.test(D.dl.trim()))return toast('Enter a valid licence number, e.g. TS09 20190012345');
 if(!D.dob)return toast('Enter your date of birth');const age=(Date.now()-new Date(D.dob))/(365.25*DAY);if(age<21)return toast('You must be at least 21 to rent a self-drive car');
 const a=D.aad.replace(/\D/g,'');if(a.length!==12)return toast('Aadhaar must be 12 digits');
 if(!D.dlImg||!D.aadImg)return toast('Upload both document photos');
 u.kyc={status:'pending',dl:D.dl.trim(),dob:D.dob,aad:a.slice(-4),dlImg:D.dlImg,aadImg:D.aadImg,submitted:Date.now()};T.kyc=null;save();toast('Submitted! We will verify shortly.');render()}

 const sugg=Math.round(({Hatchback:1400,Sedan:2100,SUV:2900,MUV:3200}[D.type]||1500)/100)*100;
 return{title:ex?'Edit car':'List your car',body:`${ex&&ex.status==='live'?'':'<div class="banner info"><span>🛡️</span><span>Every listing is checked by our team before it goes live — usually within a few hours.</span></div>'}
 ${ex?'':modelPicker()}<div class="card" style="overflow:hidden"><div class="cimg" style="margin:-14px -14px 10px">${D.photos[0]?`<img src="${D.photos[0]}">`:carSVG(D.color,D)}</div>
  <label class="lbl" style="margin-top:0">Photos (up to 6) — first one is the cover</label>
  <div class="pgrid" style="grid-template-columns:repeat(3,1fr)">${D.photos.map((p,i)=>`<div class="pslot"><img src="${p}"><button class="x" onclick="T.car.photos.splice(${i},1);render()">×</button></div>`).join('')}${D.photos.length<6?`<label class="pslot"><span>+ Add</span><input type="file" accept="image/*" multiple hidden onchange="carPhotos(this)"></label>`:''}</div>
  <label class="lbl">Colour (used when no photo)</label><div class="row wrap">${COLORS.map(c=>`<div class="swatch ${D.color===c?'on':''}" style="background:${c}" onclick="T.car.color='${c}';render()"></div>`).join('')}</div></div>
 <div class="card"><h3>Car details</h3><div class="grid2"><div><label class="lbl">Brand</label><input class="inp" placeholder="Maruti" ${f('make')}></div><div><label class="lbl">Model</label><input class="inp" placeholder="Swift" ${f('model')}></div><div><label class="lbl">Year</label>${sel('year',[2025,2024,2023,2022,2021,2020,2019,2018,2017,2016])}</div><div><label class="lbl">Seats</label>${sel('seats',[4,5,6,7,8])}</div><div><label class="lbl">Type</label>${sel('type',['Hatchback','Sedan','SUV','MUV'])}</div><div><label class="lbl">Fuel</label>${sel('fuel',['Petrol','Diesel','CNG','Electric'])}</div></div>
  <label class="lbl">Gearbox</label>${sel('trans',['Manual','Automatic'])}
  <label class="lbl">Registration number</label><input class="inp" placeholder="TS09 EX 4521" style="text-transform:uppercase" ${f('reg')}></div>
 <div class="card"><h3>Location</h3><div class="grid2"><div><label class="lbl" style="margin-top:0">City</label>${sel('city',CITIES)}</div><div><label class="lbl" style="margin-top:0">Area</label><input class="inp" placeholder="Kukatpally" ${f('area')}></div></div></div>
 <div class="card"><h3>Pricing</h3><div class="grid2"><div><label class="lbl" style="margin-top:0">Price per day (₹)</label><input class="inp" inputmode="numeric" ${f('price')}></div><div><label class="lbl" style="margin-top:0">Security deposit (₹)</label><input class="inp" inputmode="numeric" ${f('deposit')}></div></div><label class="lbl">Free km per day</label>${sel('kmLimit',[200,250,300,400,'Unlimited'].map(String))}
  <p class="xs mut mt">💡 Similar ${D.type.toLowerCase()}s in ${esc(D.city)} rent for about ${fmt(sugg)}/day. You keep ${100-S.settings.comm}% of the rent.</p></div>
 <div class="card"><h3>Features</h3><div class="row wrap">${FEATS.map(x=>`<button class="chip ${D.features.includes(x)?'on':''}" onclick="togFeat('${x}')">${x}</button>`).join('')}</div></div>
 ${ex?`<button class="btn ghost" style="color:var(--red)" onclick="delCar('${ex.id}')">Remove this listing</button>`:''}`,
 foot:`<button class="btn acc" style="flex:1" onclick="saveCar()">${ex?'Save changes':'Submit for approval'}</button>`}};
async function carPhotos(inp){const fs=[...inp.files].slice(0,6-T.car.photos.length);for(const f of fs){const d=await readImg(f);if(d)T.car.photos.push(d)}render()}
function togFeat(x){const a=T.car.features,i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);render()}
function saveCar(){const D=T.car;
 if(D.make.trim().length<2||D.model.trim().length<1)return toast('Enter brand and model');
 const reg=D.reg.trim().toUpperCase().replace(/\s+/g,' ');if(!/^[A-Z]{2}\s?\d{1,2}\s?[A-Z]{0,3}\s?\d{1,4}$/.test(reg))return toast('Enter a valid registration, e.g. TS09 EX 4521');
 const price=parseInt(D.price,10),dep=parseInt(D.deposit,10);if(!(price>=500&&price<=20000))return toast('Price per day should be ₹500 – ₹20,000');if(!(dep>=0&&dep<=50000))return toast('Deposit should be ₹0 – ₹50,000');
 if(S.cars.some(c=>c.reg.replace(/\s/g,'')===reg.replace(/\s/g,'')&&c.id!==D._id))return toast('A car with this registration is already listed');
 const km=D.kmLimit==='Unlimited'?9999:parseInt(D.kmLimit,10);
 const data={make:D.make.trim(),model:D.model.trim(),year:+D.year,reg,city:D.city,area:D.area.trim()||D.city,type:D.type,fuel:D.fuel,trans:D.trans,seats:+D.seats,price,deposit:dep,kmLimit:km,color:D.color,features:D.features.slice(),photos:D.photos.slice()};
 if(D._id==='new'){S.cars.push({id:uid('c'),ownerId:S.session.uid,...data,status:'pending',available:true,seedReviews:[],created:Date.now()});toast('Submitted! Admin will review your listing.')}
 else{const c=carById(D._id);Object.assign(c,data);if(c.status==='rejected'){c.status='pending';c.reason=''}toast('Changes saved')}
 T.car=null;save();tab('ocars')}
function delCar(id){if(S.bookings.some(b=>b.carId===id&&(b.status==='confirmed'||b.status==='active')))return toast('This car has upcoming trips — pause it instead');
 modal(`<h3>Remove listing?</h3><p class="sm mut">It will disappear from search. Past trips stay in your history.</p><button class="btn red" onclick="S.cars=S.cars.filter(c=>c.id!=='${id}');S.bookings=S.bookings.filter(b=>b.carId!=='${id}'||b.status==='completed'||b.status==='cancelled');T.car=null;save();closeModal();tab('ocars');toast('Listing removed')">Remove</button><button class="btn ghost" onclick="closeModal()">Keep it</button>`)}
SCR.obookings=()=>{const t=T.ot||'up',mine=S.bookings.filter(b=>b.ownerId===S.session.uid);
 const sets={up:mine.filter(b=>b.status==='confirmed'||b.status==='active').sort((a,b)=>a.from-b.from),act:mine.filter(b=>b.dep==='inspection'||b.dep==='disputed'),done:mine.filter(b=>b.status==='completed'||b.status==='cancelled').sort((a,b)=>b.from-a.from)};
 return{title:'Bookings',body:`<div class="seg">${[['up','Upcoming'],['act','Inspect'],['done','History']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="T.ot='${k}';render()">${l}${sets[k].length?' ('+sets[k].length+')':''}</button>`).join('')}</div>${sets[t].map(b=>bkRow(b,'obk',userById(b.renterId).name)).join('')||'<div class="empty"><div class="ic">📅</div>Nothing here yet.</div>'}`}};
SCR.obk=({id})=>{const b=bkById(id),c=carById(b.carId),r=userById(b.renterId),km=b.endOdo&&b.startOdo?b.endOdo-b.startOdo:null;
 return{title:'Booking #'+b.id,body:`<div class="card row"><div class="thumb">${carPic(c)}</div><div style="flex:1"><b>${esc(carName(c))}</b><div class="sm mut">${fdt(b.from)} → ${fdt(b.to)}</div><div class="mt">${badge(stLabel(b))}</div></div></div>
 ${b.dep==='inspection'?`<div class="card" style="border-color:var(--acc)"><h3>Inspect the car</h3><p class="sm mut">Compare the pickup and return photos below and check the car in person. If you do nothing, the deposit is released automatically after 48 h.</p>${b.extraKmCharge?`<p class="sm mt">Extra ${b.extraKm} km driven → you receive <b>${fmt(b.extraKmCharge)}</b> from the deposit.</p>`:''}<button class="btn" onclick="releaseDep('${b.id}')">✓ No damage — release deposit</button><button class="btn ghost" style="color:var(--red)" onclick="damageModal('${b.id}')">Report damage</button></div>`:''}
 ${b.dep==='disputed'?`<div class="banner red"><span>⚖️</span><span>You claimed <b>${fmt(b.damage)}</b> for damage. Admin is reviewing the photos.</span></div>`:''}
 <div class="card row"><div class="av">${initials(r.name)}</div><div style="flex:1"><b>${esc(r.name)}</b><div class="sm mut">Renter · ${maskPh(r.phone)}</div></div>${kycBadge(r)}</div>
 <div class="card"><h3>Your earnings</h3><div class="li"><span>Rent (${b.days} day${b.days>1?'s':''})</span><span>${fmt(b.rent)}</span></div><div class="li"><span>Platform commission (${b.comm}%)</span><span>−${fmt(b.rent*b.comm/100)}</span></div>${b.extraKmCharge&&['refunded','partial'].includes(b.dep)?`<div class="li"><span>Extra km charge</span><span>+${fmt(b.extraKmCharge)}</span></div>`:''}${b.dep==='partial'?`<div class="li"><span>Damage compensation</span><span>+${fmt(b.damage)}</span></div>`:''}<div class="li tot"><span>${b.status==='cancelled'?'Cancelled':b.status==='completed'?'Paid to your bank':'You will receive'}</span><span>${b.status==='cancelled'?fmt(0):fmt(payout(b))}</span></div>${b.status!=='cancelled'?'<p class="xs mut mt">Payouts are sent to your bank 24 h after the trip ends.</p>':''}</div>
 ${km!==null?`<div class="card kv"><span>Odometer</span><b>${b.startOdo.toLocaleString('en-IN')} → ${b.endOdo.toLocaleString('en-IN')} km</b><span>Distance</span><b>${km} km</b><span>Fuel</span><b>${esc(b.fuelStart)} → ${esc(b.fuelEnd)}</b></div>`:''}
 ${photosBlock(b)}
 ${b.review?`<div class="card"><b>Renter's review</b><div style="color:var(--acc)">${'★'.repeat(b.review.s)}</div><p class="sm">${esc(b.review.t)}</p></div>`:''}
 ${b.status==='confirmed'?`<button class="btn ghost" style="color:var(--red)" onclick="ownerCancel('${b.id}')">Cancel this booking</button>`:''}`}};
function releaseDep(id){const b=bkById(id);b.dep='refunded';b.refund=b.deposit-b.extraKmCharge;save();toast('Deposit released to renter');render()}
function damageModal(id){const b=bkById(id);modal(`<h3>Report damage</h3><p class="sm mut">Admin will compare pickup & return photos before deducting from the ${fmt(b.deposit)} deposit.</p><label class="lbl">Amount to claim (₹)</label><input class="inp" id="dam" inputmode="numeric" placeholder="e.g. 2500"><label class="lbl">What is damaged?</label><textarea class="inp" id="damn" placeholder="e.g. Dent on front-left door, not in pickup photos"></textarea><button class="btn red" onclick="submitDamage('${id}')">Submit claim</button><button class="btn ghost" onclick="closeModal()">Cancel</button>`)}
function submitDamage(id){const b=bkById(id),a=parseInt($('#dam').value,10),n=$('#damn').value.trim();const max=b.deposit-b.extraKmCharge;if(!(a>0))return toast('Enter the claim amount');if(a>max)return toast('Claim can be at most '+fmt(max)+' (remaining deposit)');if(n.length<8)return toast('Describe the damage');Object.assign(b,{dep:'disputed',damage:a,damageNote:n});save();closeModal();toast('Claim sent to admin');render()}
function ownerCancel(id){const b=bkById(id);modal(`<h3>Cancel as host?</h3><p class="sm mut">The renter gets a full refund of ${fmt(b.total)}. Frequent host cancellations lower your ranking in search.</p><button class="btn red" onclick="doCancel('${id}',${b.total})">Cancel booking</button><button class="btn ghost" onclick="closeModal()">Keep</button>`)}

/* ============ ADMIN ============ */
SCR.adash=()=>{const bk=S.bookings.filter(b=>b.status!=='cancelled');const gmv=bk.reduce((a,b)=>a+b.rent,0),rev=bk.reduce((a,b)=>a+platformRev(b),0),held=S.bookings.filter(b=>['held','inspection','disputed'].includes(b.dep)&&b.status!=='cancelled').reduce((a,b)=>a+b.deposit,0);
 const pk=S.users.filter(u=>u.kyc.status==='pending').length,pl=S.cars.filter(c=>c.status==='pending').length,dp=S.bookings.filter(b=>b.dep==='disputed').length;
 const byCity=CITIES.map(c=>[c,bk.filter(b=>carById(b.carId)?.city===c).reduce((a,b)=>a+b.rent,0)]),mx=Math.max(1,...byCity.map(x=>x[1]));
 return{title:'Admin overview',body:`<div class="hero-stat"><span class="sm" style="opacity:.8">Platform revenue (commission + fees)</span><div class="big">${fmt(rev)}</div><span class="sm" style="opacity:.85">from ${fmt(gmv)} rent booked · ${S.settings.comm}% commission</span></div>
 <div class="grid2"><div class="stat"><span>Users</span><b>${S.users.length}</b></div><div class="stat"><span>Live cars</span><b>${S.cars.filter(c=>c.status==='live').length}</b></div><div class="stat"><span>Bookings</span><b>${bk.length}</b></div><div class="stat"><span>Deposits held</span><b>${fmt(held)}</b></div></div>
 <div class="sec">Action queues</div>${[['akyc','🪪','KYC to verify',pk],['alist','🚙','Car listings to approve',pl],['abook','⚖️','Damage disputes',dp]].map(([s,i,l,n])=>`<div class="trow" onclick="tab('${s}')"><div class="av">${i}</div><b class="sm" style="flex:1">${l}</b>${n?badge([n+' pending','b-red']):badge(['All clear','b-ok'])}</div>`).join('')}
 <div class="sec">Rent booked by city</div><div class="card">${byCity.map(([c,v])=>`<div class="mb"><div class="row sb sm"><span>${c}</span><b>${fmt(v)}</b></div><div style="height:8px;background:#EDF1EF;border-radius:9px;margin-top:4px"><div style="height:100%;width:${v/mx*100}%;background:var(--pri2);border-radius:9px"></div></div></div>`).join('')}</div>`}};
SCR.akyc=()=>{const P=S.users.filter(u=>u.kyc.status==='pending'),V=S.users.filter(u=>u.kyc.status==='approved').length;
 return{title:'KYC verification',body:`<p class="sm mut mb">${P.length} pending · ${V} verified users</p>${P.map(u=>{const k=u.kyc,age=Math.floor((Date.now()-new Date(k.dob))/(365.25*DAY));return `<div class="card"><div class="row"><div class="av">${initials(u.name)}</div><div style="flex:1"><b>${esc(u.name)}</b><div class="xs mut">+91 ${esc(u.phone)} · submitted ${fdt(k.submitted)}</div></div></div><div class="kv mt"><span>Licence</span><b>${esc(k.dl)}</b><span>DOB / age</span><b>${esc(k.dob)} (${age} yrs)</b><span>Aadhaar</span><b>XXXX XXXX ${esc(k.aad)}</b></div><div class="grid2 mt"><img class="doc" src="${k.dlImg}"><img class="doc" src="${k.aadImg}"></div><p class="xs mut mt">Live app: auto-check licence via Parivahan/DigiLocker API, Aadhaar via OTP e-KYC.</p><div class="grid2"><button class="btn ghost" style="color:var(--red)" onclick="rejModal('kyc','${u.id}')">Reject</button><button class="btn" onclick="kycOk('${u.id}')">Approve</button></div></div>`}).join('')||'<div class="empty"><div class="ic">✅</div>No KYC pending. All caught up.</div>'}`}};
function kycOk(id){userById(id).kyc.status='approved';save();toast('KYC approved');render()}
function rejModal(kind,id){modal(`<h3>Reject ${kind==='kyc'?'KYC':'listing'}</h3><label class="lbl">Reason shown to the user</label><select class="inp" id="rr">${(kind==='kyc'?['Photo is blurry or cropped','Licence expired','Name does not match','Under 21 years']:['Photos missing or unclear','Registration number invalid','Price looks incorrect','Car is too old (pre-2016)']).map(r=>`<option>${r}</option>`).join('')}</select><button class="btn red" onclick="doRej('${kind}','${id}')">Reject</button><button class="btn ghost" onclick="closeModal()">Cancel</button>`)}
function doRej(kind,id){const r=$('#rr').value;if(kind==='kyc'){const u=userById(id);u.kyc.status='rejected';u.kyc.reason=r}else{const c=carById(id);c.status='rejected';c.reason=r}save();closeModal();toast('Rejected');render()}
SCR.alist=()=>{const t=T.lt||'pend';const P=S.cars.filter(c=>c.status==='pending'),L=S.cars.filter(c=>c.status==='live');
 return{title:'Car listings',body:`<div class="seg"><button class="${t==='pend'?'on':''}" onclick="T.lt='pend';render()">Pending (${P.length})</button><button class="${t==='live'?'on':''}" onclick="T.lt='live';render()">Live (${L.length})</button></div>
 ${(t==='pend'?P:L).map(c=>{const o=userById(c.ownerId);return `<div class="card" style="overflow:hidden"><div class="cimg" style="margin:-14px -14px 10px;aspect-ratio:2.4/1">${carPic(c)}</div><div class="row sb"><b>${esc(carName(c))} ${c.year}</b><b>${fmt(c.price)}/day</b></div><div class="kv mt"><span>Owner</span><b>${esc(o.name)} ${o.kyc.status==='approved'?'✓':'(KYC '+o.kyc.status+')'}</b><span>Reg. no.</span><b>${esc(c.reg)}</b><span>Location</span><b>${esc(c.area)}, ${c.city}</b><span>Specs</span><b>${c.type} · ${c.fuel} · ${c.trans} · ${c.seats} seats</b><span>Deposit</span><b>${fmt(c.deposit)} · ${c.kmLimit>=9999?'Unlimited':c.kmLimit+' km/day'}</b><span>Photos</span><b>${c.photos.length||'None (colour only)'}</b></div>${t==='pend'?`<div class="grid2"><button class="btn ghost" style="color:var(--red)" onclick="rejModal('car','${c.id}')">Reject</button><button class="btn" onclick="carById('${c.id}').status='live';save();toast('Listing is live');render()">Approve</button></div>`:`<button class="btn ghost" onclick="carById('${c.id}').status='rejected';carById('${c.id}').reason='Suspended by admin';save();toast('Listing suspended');render()">Suspend listing</button>`}</div>`}).join('')||'<div class="empty"><div class="ic">✅</div>Nothing pending.</div>'}`}};
SCR.abook=()=>{const t=T.at||'disp';const D=S.bookings.filter(b=>b.dep==='disputed'),A=[...S.bookings].sort((a,b)=>b.created-a.created);
 return{title:'Bookings',body:`<div class="seg"><button class="${t==='disp'?'on':''}" onclick="T.at='disp';render()">Disputes (${D.length})</button><button class="${t==='all'?'on':''}" onclick="T.at='all';render()">All (${A.length})</button></div>
 ${t==='disp'?(D.map(b=>{const c=carById(b.carId);return `<div class="card"><div class="row sb"><b>${esc(carName(c))}</b><span class="xs mut">#${b.id}</span></div><p class="sm mt">Host <b>${esc(userById(b.ownerId).name)}</b> claims <b style="color:var(--red)">${fmt(b.damage)}</b> from <b>${esc(userById(b.renterId).name)}</b>'s ${fmt(b.deposit)} deposit.</p><div class="banner warn mt"><span>“${esc(b.damageNote)}”</span></div>${photosBlock(b).replace('class="card"','')}<div class="grid2"><button class="btn ghost" onclick="resolve('${b.id}',false)">Reject claim</button><button class="btn red" onclick="resolve('${b.id}',true)">Approve deduction</button></div></div>`}).join('')||'<div class="empty"><div class="ic">⚖️</div>No open disputes.</div>')
 :A.map(b=>`<div class="trow" onclick="go('adbk',{id:'${b.id}'})"><div class="thumb">${carPic(carById(b.carId))}</div><div style="flex:1;min-width:0"><div class="row sb"><b class="sm">${esc(carName(carById(b.carId)))}</b>${badge(stLabel(b))}</div><div class="xs mut">${esc(userById(b.renterId).name)} → ${esc(userById(b.ownerId).name)}</div><div class="row sb xs" style="margin-top:3px"><span class="mut">${fdt(b.from)}</span><b>${fmt(b.total)}</b></div></div></div>`).join('')}`}};
SCR.adbk=({id})=>{const b=bkById(id),c=carById(b.carId);return{title:'#'+b.id,body:`<div class="card kv"><span>Car</span><b>${esc(carName(c))} · ${esc(c.reg)}</b><span>Renter</span><b>${esc(userById(b.renterId).name)}</b><span>Host</span><b>${esc(userById(b.ownerId).name)}</b><span>Dates</span><b>${fdt(b.from)} → ${fdt(b.to)}</b><span>Status</span><b>${stLabel(b)[0]}</b><span>Paid</span><b>${fmt(b.total)} (${esc(b.pay)})</b><span>Host payout</span><b>${fmt(b.status==='cancelled'?0:payout(b))}</b><span>Platform</span><b>${fmt(platformRev(b))}</b><span>Deposit</span><b>${depLabel(b)[0]}</b></div>${b.dep==='inspection'?`<button class="btn" onclick="releaseDep('${b.id}')">Release deposit now</button>`:''}${photosBlock(b)}`}};
function resolve(id,ok){const b=bkById(id);if(ok){b.dep='partial';b.refund=Math.max(0,b.deposit-b.damage-b.extraKmCharge);toast('Deduction approved · '+fmt(b.refund)+' refunded to renter')}else{b.dep='refunded';b.refund=b.deposit-b.extraKmCharge;b.damage=0;toast('Claim rejected · full deposit refunded')}save();render()}
SCR.aset=()=>{const s=S.settings;return{title:'Settings',body:`<div class="card"><h3>Business rules</h3>
 <label class="lbl">Commission on rent: <b style="color:var(--ink)" id="cv">${s.comm}%</b></label><input type="range" min="5" max="40" value="${s.comm}" style="width:100%;accent-color:var(--pri)" oninput="$('#cv').textContent=this.value+'%'" onchange="S.settings.comm=+this.value;save();toast('Commission set to '+this.value+'% for new bookings')">
 <div class="grid2"><div><label class="lbl">Convenience fee (₹)</label><input class="inp" inputmode="numeric" value="${s.fee}" onchange="S.settings.fee=Math.max(0,+this.value||0);save();toast('Fee updated')"></div><div><label class="lbl">Extra km rate (₹/km)</label><input class="inp" inputmode="numeric" value="${s.extraKm}" onchange="S.settings.extraKm=Math.max(0,+this.value||0);save();toast('Rate updated')"></div></div>
 <label class="lbl">GST on rent + fee</label><input class="inp" value="${s.gst}%" disabled></div>
 <div class="card sm" style="line-height:1.7"><b>Going live — what replaces the demo</b><br>• OTP login → MSG91 / Firebase Auth<br>• Payments & deposit hold → Razorpay (UPI, cards, refunds, Route payouts to hosts)<br>• KYC → DigiLocker / Parivahan licence API + Aadhaar OTP e-KYC<br>• Photos → cloud storage with time & GPS stamp<br>• Data → backend server + database shared by all users</div>
 <button class="btn ghost" onclick="resetDemo()">Reset demo data</button><button class="btn red" onclick="logout()">Log out</button>`}};

/* ============ boot ============ */
load();render();
</script>
